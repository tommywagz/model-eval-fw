[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devbench"
version = "0.2.0"
description = "devbench: Frontier Model Evaluation & Multi-Model Actor-Critic Verification Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
devbench = "devbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"devbench.ui.web" = ["static/*", "static/**/*"]
"*" = ["*.yaml", "*.yml", "*.json", "*.html", "*.css", "*.js", "*.svg", "*.png", "*.md"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-v"
